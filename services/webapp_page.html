<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ада — семейный бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #6b6b6b);
    --card: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --accent: var(--tg-theme-button-color, #2481cc);
    --ok: #2fae66; --warn: #e0a30c; --over: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 14px 32px;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--hint); font-size: 13px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { background: var(--card); border-radius: 14px; padding: 12px 14px; }
  .card.wide { grid-column: 1 / -1; }
  .label { color: var(--hint); font-size: 13px; }
  .value { font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .value.neg { color: var(--over); }
  .cmp { margin: 12px 2px 4px; font-size: 14px; color: var(--hint); }
  h2 { font-size: 16px; margin: 20px 2px 8px; }
  .cat { background: var(--card); border-radius: 14px; padding: 11px 14px; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .name { font-size: 15px; }
  .amt { font-size: 15px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bar { height: 7px; border-radius: 4px; background: rgba(127,127,127,.22); margin-top: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 4px; background: var(--ok); }
  .bar.warn > i { background: var(--warn); }
  .bar.over > i { background: var(--over); }
  .bar.none > i { background: var(--accent); opacity: .55; }
  .meta { display: flex; justify-content: space-between; margin-top: 5px; font-size: 12px; color: var(--hint); }
  .meta .over { color: var(--over); } .meta .warn { color: var(--warn); }
  .msg { text-align: center; color: var(--hint); padding: 40px 10px; }
  .seg { display: flex; gap: 6px; margin: 0 0 8px; }
  .seg button {
    flex: 1; margin: 0; padding: 8px 4px; border-radius: 10px; font-size: 14px;
    background: var(--card); color: var(--text);
  }
  .seg button.on { background: var(--accent); color: var(--tg-theme-button-text-color, #fff); }
  .exp { display: flex; justify-content: space-between; gap: 10px; padding: 9px 2px; border-bottom: 1px solid rgba(127,127,127,.18); }
  .exp .l { min-width: 0; }
  .exp .t { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp .s { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .exp .a { font-size: 15px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chart { background: var(--card); border-radius: 14px; padding: 12px 10px 10px; margin-bottom: 10px; }
  .chart h3 { font-size: 14px; font-weight: 600; margin: 0 4px 6px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--hint); font-size: 9px; font-family: inherit; }
  .chart text.val { fill: var(--text); font-size: 9.5px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 4px 0; font-size: 12px; color: var(--hint); }
  .legend i { display: inline-block; width: 16px; height: 0; border-top: 3px solid var(--accent); vertical-align: middle; margin-right: 5px; }
  .legend i.dash { border-top: 2px dashed var(--hint); }
  .note { font-size: 12px; color: var(--hint); margin-top: 8px; text-align: center; }
  button {
    margin-top: 14px; width: 100%; padding: 12px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--tg-theme-button-text-color, #fff); font-size: 15px;
  }
  button:disabled { opacity: .6; }
</style>
</head>
<body>
<header>
  <h1 id="title">Ада</h1>
  <span class="sub" id="updated"></span>
</header>
<div class="seg" id="who">
  <button data-v="family" class="on">Семья</button>
  <button data-v="me">Я</button>
  <button data-v="other">Диана</button>
</div>
<div class="seg" id="per">
  <button data-v="1" class="on">Месяц</button>
  <button data-v="3">3 мес.</button>
  <button data-v="6">Полгода</button>
  <button data-v="12">Год</button>
</div>
<div id="root"><div class="msg">Загружаю…</div></div>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var root = document.getElementById("root");
  var fmt = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 0 });
  function money(v) { return fmt.format(Math.round(v)).replace(/\u00a0/g, " ") + " ₸"; }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function message(text) { root.replaceChildren(el("div", "msg", text)); }

  function card(label, value, extra) {
    var c = el("div", "card" + (extra && extra.wide ? " wide" : ""));
    c.appendChild(el("div", "label", label));
    c.appendChild(el("div", "value" + (extra && extra.neg ? " neg" : ""), value));
    return c;
  }

  function raz(n) {
    var m10 = n % 10, m100 = n % 100;
    return (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) ? "раза" : "раз";
  }

  function comparison(d) {
    var p = d.prev;
    if (p.expense_delta_pct === null) return null;
    var pct = p.expense_delta_pct, abs = Math.abs(pct), text;
    var tail = " за то же время " + p.phrase + ": было " + money(p.expense) + ".";
    if (abs < 1) text = "Расходы на уровне, что и" + tail;
    else if (pct >= 400) {
      var k = Math.round(d.expense / p.expense);
      text = "Расходы в " + k + " " + raz(k) + " больше, чем" + tail;
    } else text = "Расходы на " + abs + "% " + (pct > 0 ? "больше" : "меньше") + ", чем" + tail;
    return el("div", "cmp", text);
  }

  function category(c, family) {
    var box = el("div", "cat");
    var row = el("div", "row");
    row.appendChild(el("span", "name", c.name));
    row.appendChild(el("span", "amt", money(c.spent)));
    box.appendChild(row);
    var bar = el("div", "bar " + c.status);
    var fill = el("i");
    var width = c.limit ? Math.min(100, c.limit_pct) : c.share_pct;
    fill.style.width = Math.max(2, width) + "%";
    bar.appendChild(fill);
    box.appendChild(bar);
    var meta = el("div", "meta");
    if (c.limit) {
      meta.appendChild(el("span", c.status === "ok" ? "" : c.status,
        c.status === "over" ? "Перерасход " + money(c.spent - c.limit) : "Использовано " + c.limit_pct + "%"));
      meta.appendChild(el("span", "", "лимит " + money(c.limit)));
    } else {
      meta.appendChild(el("span", "", c.share_pct + "% всех трат"));
      meta.appendChild(el("span", "", family ? "без лимита" : ""));
    }
    box.appendChild(meta);
    return box;
  }

  var PAGE = 30;
  function expensesBlock(d) {
    var wrap = el("div");
    wrap.appendChild(el("h2", "", "Траты по убыванию"));
    if (!d.expenses.length) { wrap.appendChild(el("div", "msg", "Расходов за этот период нет.")); return wrap; }
    var list = el("div");
    wrap.appendChild(list);
    var shown = 0;
    var more = el("button", "more", "");
    function showMore() {
      d.expenses.slice(shown, shown + PAGE).forEach(function (e) {
        var row = el("div", "exp");
        var l = el("div", "l");
        l.appendChild(el("div", "t", e.text || e.category));
        var sub = e.date + " · " + e.category + (d.who === "family" ? " · " + e.user : "");
        l.appendChild(el("div", "s", sub));
        row.appendChild(l);
        row.appendChild(el("div", "a", money(e.amount)));
        list.appendChild(row);
      });
      shown = Math.min(d.expenses.length, shown + PAGE);
      if (shown >= d.expenses.length) more.remove();
      else more.textContent = "Показать ещё (" + (d.expenses.length - shown) + ")";
    }
    more.addEventListener("click", showMore);
    showMore();
    if (shown < d.expenses.length) wrap.appendChild(more);
    if (d.expenses_total > d.expenses.length)
      wrap.appendChild(el("div", "note", "Показаны " + d.expenses.length + " крупнейших из " + d.expenses_total + "."));
    return wrap;
  }

  var NS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function compact(v) {
    if (v >= 1e6) return (v / 1e6).toFixed(1).replace(".", ",") + " млн";
    if (v >= 1e3) return Math.round(v / 1e3) + " тыс.";
    return String(Math.round(v));
  }

  function lineChart(dy) {
    var W = 340, H = 150, L = 6, R = 44, T = 10, B = 20;
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img" });
    var all = dy.cur.concat(dy.prev);
    var max = Math.max.apply(null, all.concat([1])) * 1.08;
    var n = dy.days_in_month;
    function x(day) { return L + (W - L - R) * (day - 1) / Math.max(n - 1, 1); }
    function y(v) { return T + (H - T - B) * (1 - v / max); }
    [0, 0.5, 1].forEach(function (f) {
      var gy = y(max / 1.08 * f);
      svg.appendChild(svgEl("line", { x1: L, x2: W - R, y1: gy, y2: gy, stroke: "rgba(127,127,127,.25)", "stroke-width": 1 }));
      svg.appendChild(svgEl("text", { x: W - R + 4, y: gy + 3 }, compact(max / 1.08 * f)));
    });
    function path(arr) {
      return arr.map(function (v, i) { return (i ? "L" : "M") + x(i + 1).toFixed(1) + " " + y(v).toFixed(1); }).join(" ");
    }
    if (dy.prev.length) svg.appendChild(svgEl("path", { d: path(dy.prev), fill: "none", stroke: "var(--hint)",
      "stroke-width": 1.6, "stroke-dasharray": "4 3" }));
    if (dy.cur.length) {
      var last = dy.cur.length;
      svg.appendChild(svgEl("path", { d: path(dy.cur) + " L" + x(last).toFixed(1) + " " + y(0) + " L" + x(1).toFixed(1) + " " + y(0) + " Z",
        fill: "var(--accent)", opacity: 0.12 }));
      svg.appendChild(svgEl("path", { d: path(dy.cur), fill: "none", stroke: "var(--accent)", "stroke-width": 2.5,
        "stroke-linejoin": "round", "stroke-linecap": "round" }));
      svg.appendChild(svgEl("circle", { cx: x(last), cy: y(dy.cur[last - 1]), r: 3.5, fill: "var(--accent)" }));
    }
    [1, 8, 15, 22, n].forEach(function (d, i, a) {
      if (i === a.length - 1 && n - 22 < 4) return;
      svg.appendChild(svgEl("text", { x: x(d), y: H - 5, "text-anchor": "middle" }, String(d)));
    });
    return svg;
  }

  function barChart(bars) {
    var W = 340, H = 140, T = 16, B = 20, gap = 8;
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img" });
    var max = Math.max.apply(null, bars.map(function (b) { return b.value; }).concat([1]));
    var bw = Math.min(46, (W - gap * (bars.length + 1)) / bars.length);
    var total = bw * bars.length + gap * (bars.length - 1);
    var x0 = (W - total) / 2;
    bars.forEach(function (b, i) {
      var h = Math.max(b.value > 0 ? 2 : 0, (H - T - B) * b.value / max);
      var bx = x0 + i * (bw + gap), by = H - B - h;
      svg.appendChild(svgEl("rect", { x: bx, y: by, width: bw, height: h, rx: 4, fill: "var(--accent)",
        opacity: i === bars.length - 1 ? 1 : 0.55 }));
      if (b.value > 0) svg.appendChild(svgEl("text", { x: bx + bw / 2, y: by - 3, "text-anchor": "middle", "class": "val" }, compact(b.value)));
      svg.appendChild(svgEl("text", { x: bx + bw / 2, y: H - 6, "text-anchor": "middle" }, b.label));
    });
    return svg;
  }

  function chartCard(title, svg, legend) {
    var c = el("div", "chart");
    c.appendChild(el("h3", "", title));
    c.appendChild(svg);
    if (legend) c.appendChild(legend);
    return c;
  }

  function chartsBlock(d) {
    var dy = d.dynamics, wrap = el("div");
    if (!dy) return wrap;
    wrap.appendChild(el("h2", "", "Динамика"));
    if (dy.kind === "daily") {
      var legend = el("div", "legend");
      var a = el("span"); a.appendChild(el("i")); a.appendChild(document.createTextNode("этот месяц"));
      var b = el("span"); b.appendChild(el("i", "dash")); b.appendChild(document.createTextNode(dy.prev_label));
      legend.appendChild(a); legend.appendChild(b);
      wrap.appendChild(chartCard("Накопленные расходы по дням", lineChart(dy), legend));
      wrap.appendChild(chartCard("По неделям", barChart(dy.bars)));
    } else {
      wrap.appendChild(chartCard("Расходы по месяцам", barChart(dy.bars)));
    }
    return wrap;
  }

  function render(d) {
    document.getElementById("title").textContent = d.month_label;
    document.getElementById("updated").textContent = "обновлено " + d.updated_at;
    var otherBtn = document.querySelector('#who button[data-v="other"]');
    if (d.other) otherBtn.textContent = d.other;
    var family = d.who === "family";
    var frag = document.createDocumentFragment();
    var cards = el("div", "cards");
    cards.appendChild(card("Расход", money(d.expense)));
    cards.appendChild(card("Доход", money(d.income)));
    cards.appendChild(card("Остаток", money(d.balance), { wide: true, neg: d.balance < 0 }));
    frag.appendChild(cards);
    var cmp = comparison(d);
    if (cmp) frag.appendChild(cmp);
    frag.appendChild(chartsBlock(d));
    frag.appendChild(el("h2", "", "Категории"));
    if (!d.categories.length) frag.appendChild(el("div", "msg", "Пока нет расходов за этот период."));
    d.categories.forEach(function (c) { frag.appendChild(category(c, family)); });
    frag.appendChild(expensesBlock(d));
    var btn = el("button", "", "Обновить");
    btn.addEventListener("click", function () { load(true, btn); });
    frag.appendChild(btn);
    root.replaceChildren(frag);
  }

  var state = { who: "family", period: "1" };
  var seq = 0;

  async function load(force, btn) {
    var my = ++seq;
    if (btn) btn.disabled = true;
    var q = "?period=" + state.period + "&who=" + state.who + (force ? "&refresh=1" : "");
    try {
      var r = await fetch("/api/dashboard" + q, { headers: { "X-Telegram-Init-Data": tg.initData } });
      if (my !== seq) return;              // пришёл устаревший ответ — пользователь уже переключил
      if (r.status === 403) return message("Доступ закрыт.");
      if (!r.ok) return message("Не удалось загрузить данные. Попробуй чуть позже.");
      var d = await r.json();
      if (my !== seq) return;
      render(d);
    } catch (e) {
      if (my === seq) message("Не удалось связаться с сервером.");
    }
  }

  function bindSeg(id, key) {
    document.getElementById(id).addEventListener("click", function (ev) {
      var b = ev.target.closest("button");
      if (!b || b.dataset.v === state[key]) return;
      state[key] = b.dataset.v;
      this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
      message("Загружаю…");
      load(false);
    });
  }
  bindSeg("who", "who");
  bindSeg("per", "period");

  if (!tg || !tg.initData) {
    message("Открой мини-апп из Telegram, через кнопку в боте.");
    return;
  }
  tg.ready();
  tg.expand();
  load(false);
})();
</script>
</body>
</html>
