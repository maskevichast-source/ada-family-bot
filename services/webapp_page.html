<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ада — семейный бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #6b6b6b);
    --card: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --accent: var(--tg-theme-button-color, #2481cc);
    --ok: #2fae66; --warn: #e0a30c; --over: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 14px 32px;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--hint); font-size: 13px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { background: var(--card); border-radius: 14px; padding: 12px 14px; }
  .card.wide { grid-column: 1 / -1; }
  .label { color: var(--hint); font-size: 13px; }
  .value { font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .value.neg { color: var(--over); }
  .cmp { margin: 12px 2px 4px; font-size: 14px; color: var(--hint); }
  h2 { font-size: 16px; margin: 20px 2px 8px; }
  .cat { background: var(--card); border-radius: 14px; padding: 11px 14px; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .name { font-size: 15px; }
  .amt { font-size: 15px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bar { height: 7px; border-radius: 4px; background: rgba(127,127,127,.22); margin-top: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 4px; background: var(--ok); }
  .bar.warn > i { background: var(--warn); }
  .bar.over > i { background: var(--over); }
  .bar.none > i { background: var(--accent); opacity: .55; }
  .meta { display: flex; justify-content: space-between; margin-top: 5px; font-size: 12px; color: var(--hint); }
  .meta .over { color: var(--over); } .meta .warn { color: var(--warn); }
  .msg { text-align: center; color: var(--hint); padding: 40px 10px; }
  .seg { display: flex; gap: 6px; margin: 0 0 8px; }
  .seg button {
    flex: 1; margin: 0; padding: 8px 4px; border-radius: 10px; font-size: 14px;
    background: var(--card); color: var(--text);
  }
  .seg button.on { background: var(--accent); color: var(--tg-theme-button-text-color, #fff); }
  .exp { display: flex; justify-content: space-between; gap: 10px; padding: 9px 2px; border-bottom: 1px solid rgba(127,127,127,.18); }
  .exp .l { min-width: 0; }
  .exp .t { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exp .s { font-size: 12px; color: var(--hint); margin-top: 3px; }
  .exp .n {
    font-size: 13px; margin-top: 2px; line-height: 1.3; opacity: .85;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .exp.open .n { display: block; -webkit-line-clamp: unset; }
  .exp.open .t { white-space: normal; }
  .exp.has-note { cursor: pointer; }
  .exp .a { font-size: 15px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chart { background: var(--card); border-radius: 14px; padding: 12px 10px 10px; margin-bottom: 10px; }
  .chart h3 { font-size: 14px; font-weight: 600; margin: 0 4px 6px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--hint); font-size: 9px; font-family: inherit; }
  .chart text.val { fill: var(--text); font-size: 9.5px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 4px 0; font-size: 12px; color: var(--hint); }
  .legend i { display: inline-block; width: 16px; height: 0; border-top: 3px solid var(--accent); vertical-align: middle; margin-right: 5px; }
  .legend i.dash { border-top: 2px dashed var(--hint); }
  body { padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
  nav#tabs {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 2px;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
    background: var(--tg-theme-secondary-bg-color, #f1f1f4); border-top: 1px solid rgba(127,127,127,.25);
  }
  nav#tabs button {
    flex: 1; margin: 0; padding: 6px 2px; border-radius: 10px; background: transparent;
    color: var(--hint); font-size: 11px; line-height: 1.25;
  }
  nav#tabs button span { display: block; font-size: 18px; }
  nav#tabs button.on { color: var(--accent); background: rgba(127,127,127,.14); }
  .chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 9px; background: rgba(127,127,127,.2); color: var(--hint); }
  .chip.good { background: rgba(47,174,102,.2); color: var(--ok); }
  .chip.bad { background: rgba(229,72,77,.2); color: var(--over); }
  .item { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  .item .sub { margin-top: 4px; font-size: 12px; }
  .item .sub.over { color: var(--over); } .item .sub.warn { color: var(--warn); }
  .item a.link { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--accent); text-decoration: none; }
  .good { color: var(--ok); } .bad { color: var(--over); }
  .cat.click { cursor: pointer; } .cat.click:active { opacity: .7; }
  button.back { background: transparent; color: var(--accent); text-align: left; padding: 4px 0; margin: 0 0 6px; width: auto; }
  .alerts { background: var(--card); border-radius: 14px; padding: 10px 12px 6px; margin: 12px 0 4px; }
  .alerts h3 { font-size: 14px; margin: 0 0 4px; }
  .alert { display: flex; gap: 8px; padding: 7px 0; font-size: 13px; line-height: 1.35; cursor: pointer; }
  .alert + .alert { border-top: 1px solid rgba(127,127,127,.18); }
  input.search {
    width: 100%; padding: 10px 12px; margin: 0 0 6px; border: 0; border-radius: 10px; font-size: 15px;
    background: var(--card); color: var(--text); outline: none;
  }
  .sub-line { font-size: 12px; color: var(--hint); margin-top: 6px; }
  .note { font-size: 12px; color: var(--hint); margin-top: 8px; text-align: center; }
  button {
    margin-top: 14px; width: 100%; padding: 12px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--tg-theme-button-text-color, #fff); font-size: 15px;
  }
  button:disabled { opacity: .6; }
</style>
</head>
<body>
<header>
  <h1 id="title">Ада</h1>
  <span class="sub" id="updated"></span>
</header>
<div id="controls">
<div class="seg" id="who">
  <button data-v="family" class="on">Семья</button>
  <button data-v="me">Я</button>
  <button data-v="other">Диана</button>
</div>
<div class="seg" id="per">
  <button data-v="7d">7 дн.</button>
  <button data-v="1" class="on">Месяц</button>
  <button data-v="3">3 мес.</button>
  <button data-v="6">Полгода</button>
  <button data-v="12">Год</button>
</div>
</div>
<div id="root"><div class="msg">Загружаю…</div></div>
<nav id="tabs">
  <button data-t="overview" class="on"><span>📊</span>Обзор</button>
  <button data-t="debts"><span>🤝</span>Долги</button>
  <button data-t="goals"><span>🎯</span>Цели</button>
  <button data-t="subscriptions"><span>🔁</span>Подписки</button>
  <button data-t="prices"><span>🏷️</span>Цены</button>
</nav>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var root = document.getElementById("root");
  var fmt = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 0 });
  function money(v) { return fmt.format(Math.round(v)).replace(/\u00a0/g, " ") + " ₸"; }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function message(text) { root.replaceChildren(el("div", "msg", text)); }

  function card(label, value, extra) {
    var c = el("div", "card" + (extra && extra.wide ? " wide" : ""));
    c.appendChild(el("div", "label", label));
    c.appendChild(el("div", "value" + (extra && extra.neg ? " neg" : ""), value));
    return c;
  }

  function raz(n) {
    var m10 = n % 10, m100 = n % 100;
    return (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) ? "раза" : "раз";
  }

  function comparison(d) {
    var p = d.prev;
    if (p.expense_delta_pct === null) return null;
    var pct = p.expense_delta_pct, abs = Math.abs(pct), text;
    var tail = d.period_days
      ? " за предыдущие " + d.period_days + " дн.: было " + money(p.expense) + "."
      : " за то же время " + p.phrase + ": было " + money(p.expense) + ".";
    if (abs < 1) text = "Расходы на уровне, что и" + tail;
    else if (pct >= 400) {
      var k = Math.round(d.expense / p.expense);
      text = "Расходы в " + k + " " + raz(k) + " больше, чем" + tail;
    } else text = "Расходы на " + abs + "% " + (pct > 0 ? "больше" : "меньше") + ", чем" + tail;
    return el("div", "cmp", text);
  }

  function category(c, family, onOpen) {
    var box = el("div", "cat" + (onOpen ? " click" : ""));
    var row = el("div", "row");
    row.appendChild(el("span", "name", c.name + (onOpen ? " ›" : "")));
    row.appendChild(el("span", "amt", money(c.spent)));
    box.appendChild(row);
    var bar = el("div", "bar " + c.status);
    var fill = el("i");
    var width = c.limit ? Math.min(100, c.limit_pct) : c.share_pct;
    fill.style.width = Math.max(2, width) + "%";
    bar.appendChild(fill);
    box.appendChild(bar);
    var meta = el("div", "meta");
    if (c.limit) {
      meta.appendChild(el("span", c.status === "ok" ? "" : c.status,
        c.status === "over" ? "Перерасход " + money(c.spent - c.limit) : "Использовано " + c.limit_pct + "%"));
      meta.appendChild(el("span", "", "лимит " + money(c.limit)));
    } else {
      meta.appendChild(el("span", "", c.share_pct + "% всех трат"));
      meta.appendChild(el("span", "", family ? "без лимита" : ""));
    }
    box.appendChild(meta);
    if (onOpen) box.addEventListener("click", function () { onOpen(c.name); });
    return box;
  }

  var PAGE = 30;
  var expensesUI = null;
  function opWord(n) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return "операция";
    return (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) ? "операции" : "операций";
  }

  function expensesBlock(d) {
    var wrap = el("div");
    wrap.appendChild(el("h2", "", "Траты по убыванию"));
    var input = el("input", "search");
    input.type = "search";
    input.placeholder = "Найти трату: магазин, слово, сумма";
    input.value = state.q || "";
    input.setAttribute("enterkeyhint", "search");
    wrap.appendChild(input);
    var summary = el("div", "sub-line");
    wrap.appendChild(summary);
    var list = el("div");
    wrap.appendChild(list);
    var more = el("button", "more", "");
    wrap.appendChild(more);
    var note = el("div", "note");
    wrap.appendChild(note);
    var data = d, shown = 0;

    function addRows() {
      data.expenses.slice(shown, shown + PAGE).forEach(function (e) {
        var row = el("div", "exp" + (e.note ? " has-note" : ""));
        var l = el("div", "l");
        l.appendChild(el("div", "t", e.text || e.subcat || e.category));
        if (e.note) l.appendChild(el("div", "n", e.note));
        var sub = e.date + " · " + e.category + (e.subcat && e.subcat !== e.text ? " › " + e.subcat : "") +
          (data.who === "family" ? " · " + e.user : "");
        l.appendChild(el("div", "s", sub));
        row.appendChild(l);
        if (e.note) row.addEventListener("click", function () { row.classList.toggle("open"); });
        row.appendChild(el("div", "a", money(e.amount)));
        list.appendChild(row);
      });
      shown = Math.min(data.expenses.length, shown + PAGE);
      more.style.display = shown >= data.expenses.length ? "none" : "";
      more.textContent = "Показать ещё (" + (data.expenses.length - shown) + ")";
    }
    function fill(nd) {
      data = nd; shown = 0;
      list.replaceChildren();
      if (data.search) summary.textContent = data.search.count
        ? "Найдено: " + data.search.count + " " + opWord(data.search.count) + " на " + money(data.search.sum)
        : "Ничего не найдено.";
      else summary.textContent = "";
      if (!data.expenses.length) {
        if (!data.search) list.appendChild(el("div", "msg", "Расходов за этот период нет."));
        more.style.display = "none"; note.textContent = "";
        return;
      }
      addRows();
      note.textContent = data.expenses_total > data.expenses.length
        ? "Показаны " + data.expenses.length + " крупнейших из " + data.expenses_total + "." : "";
    }
    more.addEventListener("click", addRows);
    var timer = null;
    input.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(function () { state.q = input.value.trim(); searchLoad(); }, 350);
    });
    expensesUI = { fill: fill };
    fill(d);
    return wrap;
  }

  var NS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function compact(v) {
    if (v >= 1e6) return (v / 1e6).toFixed(1).replace(".", ",") + " млн";
    if (v >= 1e3) return Math.round(v / 1e3) + " тыс.";
    return String(Math.round(v));
  }

  function lineChart(dy) {
    var W = 340, H = 150, L = 6, R = 44, T = 10, B = 20;
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img" });
    var all = dy.cur.concat(dy.prev);
    var max = Math.max.apply(null, all.concat([1])) * 1.08;
    var n = dy.days_in_month;
    function x(day) { return L + (W - L - R) * (day - 1) / Math.max(n - 1, 1); }
    function y(v) { return T + (H - T - B) * (1 - v / max); }
    [0, 0.5, 1].forEach(function (f) {
      var gy = y(max / 1.08 * f);
      svg.appendChild(svgEl("line", { x1: L, x2: W - R, y1: gy, y2: gy, stroke: "rgba(127,127,127,.25)", "stroke-width": 1 }));
      svg.appendChild(svgEl("text", { x: W - R + 4, y: gy + 3 }, compact(max / 1.08 * f)));
    });
    function path(arr) {
      return arr.map(function (v, i) { return (i ? "L" : "M") + x(i + 1).toFixed(1) + " " + y(v).toFixed(1); }).join(" ");
    }
    if (dy.prev.length) svg.appendChild(svgEl("path", { d: path(dy.prev), fill: "none", stroke: "var(--hint)",
      "stroke-width": 1.6, "stroke-dasharray": "4 3" }));
    if (dy.cur.length) {
      var last = dy.cur.length;
      svg.appendChild(svgEl("path", { d: path(dy.cur) + " L" + x(last).toFixed(1) + " " + y(0) + " L" + x(1).toFixed(1) + " " + y(0) + " Z",
        fill: "var(--accent)", opacity: 0.12 }));
      svg.appendChild(svgEl("path", { d: path(dy.cur), fill: "none", stroke: "var(--accent)", "stroke-width": 2.5,
        "stroke-linejoin": "round", "stroke-linecap": "round" }));
      svg.appendChild(svgEl("circle", { cx: x(last), cy: y(dy.cur[last - 1]), r: 3.5, fill: "var(--accent)" }));
    }
    [1, 8, 15, 22, n].forEach(function (d, i, a) {
      if (i === a.length - 1 && n - 22 < 4) return;
      svg.appendChild(svgEl("text", { x: x(d), y: H - 5, "text-anchor": "middle" }, String(d)));
    });
    return svg;
  }

  function barChart(bars) {
    var W = 340, H = 140, T = 16, B = 20, gap = 8;
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img" });
    var max = Math.max.apply(null, bars.map(function (b) { return b.value; }).concat([1]));
    var bw = Math.min(46, (W - gap * (bars.length + 1)) / bars.length);
    var total = bw * bars.length + gap * (bars.length - 1);
    var x0 = (W - total) / 2;
    bars.forEach(function (b, i) {
      var h = Math.max(b.value > 0 ? 2 : 0, (H - T - B) * b.value / max);
      var bx = x0 + i * (bw + gap), by = H - B - h;
      svg.appendChild(svgEl("rect", { x: bx, y: by, width: bw, height: h, rx: 4, fill: "var(--accent)",
        opacity: i === bars.length - 1 ? 1 : 0.55 }));
      if (b.value > 0) svg.appendChild(svgEl("text", { x: bx + bw / 2, y: by - 3, "text-anchor": "middle", "class": "val" }, compact(b.value)));
      svg.appendChild(svgEl("text", { x: bx + bw / 2, y: H - 6, "text-anchor": "middle" }, b.label));
    });
    return svg;
  }

  function chartCard(title, svg, legend) {
    var c = el("div", "chart");
    c.appendChild(el("h3", "", title));
    c.appendChild(svg);
    if (legend) c.appendChild(legend);
    return c;
  }

  function chartsBlock(d) {
    var dy = d.dynamics, wrap = el("div");
    if (!dy) return wrap;
    wrap.appendChild(el("h2", "", "Динамика"));
    if (d.period_days && d.week) {
      var w = d.week, wl = el("div", "legend");
      var cmpText = w.delta_pct === null ? "" : " · к предыдущим 7 дням " + (w.delta_pct > 0 ? "+" : "") + w.delta_pct + "%";
      wl.appendChild(el("span", "", "всего " + money(w.total) + " · в среднем " + money(w.avg) + " в день" + cmpText));
      wrap.appendChild(chartCard("Расходы по дням", barChart(w.days), wl));
      return wrap;
    }
    if (dy.kind === "daily") {
      var legend = el("div", "legend");
      var a = el("span"); a.appendChild(el("i")); a.appendChild(document.createTextNode("этот месяц"));
      var b = el("span"); b.appendChild(el("i", "dash")); b.appendChild(document.createTextNode(dy.prev_label));
      legend.appendChild(a); legend.appendChild(b);
      wrap.appendChild(chartCard("Накопленные расходы по дням", lineChart(dy), legend));
      wrap.appendChild(chartCard("По неделям", barChart(dy.bars)));
    } else {
      wrap.appendChild(chartCard("Расходы по месяцам", barChart(dy.bars)));
    }
    return wrap;
  }

  function openCategory(name) { state.cat = name; state.q = ""; message("Загружаю…"); load(false); }
  function closeCategory() { state.cat = null; state.q = ""; message("Загружаю…"); load(false); }
  function syncBack() {
    if (!tg || !tg.BackButton) return;
    if (state.cat && state.tab === "overview") tg.BackButton.show(); else tg.BackButton.hide();
  }

  function alertLine(a) {
    var line = el("div", "alert");
    var icon, text;
    if (a.type === "limit") {
      icon = a.status === "over" ? "🔴" : "🟡";
      text = a.status === "over"
        ? "перерасход " + money(a.spent - a.limit) + " (лимит " + money(a.limit) + ")"
        : a.pct + "% лимита: " + money(a.spent) + " из " + money(a.limit);
    } else if (a.type === "big") {
      icon = "💸";
      text = (a.text ? a.text + " — " : "") + money(a.amount) + " · " + a.date + " (" + a.user +
        "). Раньше максимум был " + money(a.prev_max);
    } else {
      icon = "📈";
      text = money(a.spent) + " — в " + String(a.ratio).replace(".", ",") + " раза выше обычного темпа (" + money(a.usual) + ")";
    }
    line.appendChild(el("span", "", icon));
    var body = el("div");
    body.appendChild(el("b", "", a.category));
    body.appendChild(document.createTextNode(": " + text));
    line.appendChild(body);
    line.addEventListener("click", function () { openCategory(a.category); });
    return line;
  }
  function alertsBlock(d) {
    if (!d.alerts || !d.alerts.length) return null;
    var box = el("div", "alerts");
    box.appendChild(el("h3", "", "Внимание · вся семья"));
    d.alerts.forEach(function (a) { box.appendChild(alertLine(a)); });
    return box;
  }

  function shareRow(name, spent, share, left, right) {
    var box = el("div", "cat");
    var row = el("div", "row");
    row.appendChild(el("span", "name", name));
    row.appendChild(el("span", "amt", money(spent)));
    box.appendChild(row);
    var bar = el("div", "bar none");
    var fill = el("i"); fill.style.width = Math.max(2, share) + "%";
    bar.appendChild(fill); box.appendChild(bar);
    var meta = el("div", "meta");
    meta.appendChild(el("span", "", left)); meta.appendChild(el("span", "", right || ""));
    box.appendChild(meta);
    return box;
  }

  function peopleBlock(d) {
    if (!d.people || !d.people.length || d.expense <= 0) return null;
    var wrap = el("div");
    wrap.appendChild(el("h2", "", "Кто сколько потратил"));
    d.people.forEach(function (p) {
      var box = shareRow(p.name, p.expense, p.share_pct, p.share_pct + "% всех трат",
        p.income > 0 ? "доход " + money(p.income) : "");
      if (p.top.length) box.appendChild(el("div", "sub-line",
        "Чаще всего: " + p.top.map(function (t) { return t.category + " " + money(t.spent); }).join(", ")));
      wrap.appendChild(box);
    });
    return wrap;
  }

  function breakdownBlock(d, family) {
    var wrap = el("div");
    wrap.appendChild(el("h2", "", "Разрез трат"));
    var seg = el("div", "seg");
    var box = el("div");
    var views = [["categories", "Категории"], ["banks", "Банки и карты"], ["merchants", "Магазины"]];
    function paint() {
      seg.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.dataset.v === state.view); });
      var f = document.createDocumentFragment();
      if (state.view === "banks") {
        d.banks.forEach(function (b) { f.appendChild(shareRow(b.name, b.spent, b.share_pct, b.count + " " + opWord(b.count), b.share_pct + "%")); });
        if (!d.banks.length) f.appendChild(el("div", "msg", "Расходов за этот период нет."));
      } else if (state.view === "merchants") {
        d.merchants.forEach(function (m) { f.appendChild(shareRow(m.name, m.spent, m.share_pct, m.count + " " + opWord(m.count), m.share_pct + "%")); });
        if (!d.merchants.length) f.appendChild(el("div", "msg", "В записях за этот период нет названий магазинов."));
      } else {
        if (!d.categories.length) f.appendChild(el("div", "msg", "Пока нет расходов за этот период."));
        d.categories.forEach(function (c) { f.appendChild(category(c, family, openCategory)); });
      }
      box.replaceChildren(f);
    }
    views.forEach(function (v) {
      var b = el("button", "", v[1]); b.dataset.v = v[0];
      b.addEventListener("click", function () { state.view = v[0]; paint(); });
      seg.appendChild(b);
    });
    wrap.appendChild(seg); wrap.appendChild(box);
    paint();
    return wrap;
  }

  function subcatsBlock(d) {
    var wrap = el("div");
    wrap.appendChild(el("h2", "", "Подкатегории"));
    if (!d.subcats.length) { wrap.appendChild(el("div", "msg", "Расходов в этой категории за период нет.")); return wrap; }
    d.subcats.forEach(function (s) {
      wrap.appendChild(shareRow(s.name, s.spent, s.share_pct, s.count + " " + opWord(s.count), s.share_pct + "%"));
    });
    return wrap;
  }

  function renderDetail(d) {
    document.getElementById("title").textContent = d.category;
    document.getElementById("updated").textContent = "обновлено " + d.updated_at;
    var frag = document.createDocumentFragment();
    var back = el("button", "back", "‹ Все категории");
    back.addEventListener("click", closeCategory);
    frag.appendChild(back);
    frag.appendChild(el("div", "cmp", d.month_label + (d.who === "family" ? " · вся семья" : " · " + d.who)));
    var cards = el("div", "cards");
    cards.appendChild(card("Расход в категории", money(d.expense), { wide: true }));
    frag.appendChild(cards);
    if (d.category_limit) frag.appendChild(category({
      name: "Лимит категории", spent: d.expense, limit: d.category_limit.limit,
      limit_pct: d.category_limit.pct, status: d.category_limit.status, share_pct: 0 }, true));
    var cmp = comparison(d);
    if (cmp) frag.appendChild(cmp);
    frag.appendChild(chartsBlock(d));
    frag.appendChild(subcatsBlock(d));
    frag.appendChild(expensesBlock(d));
    var btn = el("button", "", "Обновить");
    btn.addEventListener("click", function () { load(true, btn); });
    frag.appendChild(btn);
    root.replaceChildren(frag);
  }

  function render(d) {
    syncBack();
    if (d.category) return renderDetail(d);
    document.getElementById("title").textContent = d.month_label;
    document.getElementById("updated").textContent = "обновлено " + d.updated_at;
    var otherBtn = document.querySelector('#who button[data-v="other"]');
    if (d.other) otherBtn.textContent = d.other;
    var family = d.who === "family";
    var frag = document.createDocumentFragment();
    var cards = el("div", "cards");
    cards.appendChild(card("Расход", money(d.expense)));
    cards.appendChild(card("Доход", money(d.income)));
    cards.appendChild(card("Остаток", money(d.balance), { wide: true, neg: d.balance < 0 }));
    frag.appendChild(cards);
    var cmp = comparison(d);
    if (cmp) frag.appendChild(cmp);
    var alerts = alertsBlock(d);
    if (alerts) frag.appendChild(alerts);
    var people = peopleBlock(d);
    if (people) frag.appendChild(people);
    frag.appendChild(chartsBlock(d));
    frag.appendChild(breakdownBlock(d, family));
    frag.appendChild(expensesBlock(d));
    var btn = el("button", "", "Обновить");
    btn.addEventListener("click", function () { load(true, btn); });
    frag.appendChild(btn);
    root.replaceChildren(frag);
  }

  var state = { who: "family", period: "1", tab: "overview", cat: null, q: "", view: "categories" };
  var seq = 0, qseq = 0;

  function buildQuery(force) {
    return "?period=" + state.period + "&who=" + state.who +
      (state.cat ? "&cat=" + encodeURIComponent(state.cat) : "") +
      (state.q ? "&q=" + encodeURIComponent(state.q) : "") + (force ? "&refresh=1" : "");
  }

  async function load(force, btn) {
    var my = ++seq;
    if (btn) btn.disabled = true;
    try {
      var r = await fetch("/api/dashboard" + buildQuery(force), { headers: { "X-Telegram-Init-Data": tg.initData } });
      if (my !== seq) return;              // пришёл устаревший ответ — пользователь уже переключил
      if (r.status === 403) return message("Доступ закрыт.");
      if (!r.ok) return message("Не удалось загрузить данные. Попробуй чуть позже.");
      var d = await r.json();
      if (my !== seq) return;
      render(d);
    } catch (e) {
      if (my === seq) message("Не удалось связаться с сервером.");
    }
  }

  // Поиск обновляет только список трат: поле ввода не пересоздаётся, клавиатура не закрывается.
  async function searchLoad() {
    var my = ++qseq;
    try {
      var r = await fetch("/api/dashboard" + buildQuery(false), { headers: { "X-Telegram-Init-Data": tg.initData } });
      if (my !== qseq || !r.ok) return;
      var nd = await r.json();
      if (my !== qseq || !expensesUI) return;
      expensesUI.fill(nd);
    } catch (e) { /* оставляем прежний список */ }
  }

  // ---------- вкладки со списками ----------
  var TAB_TITLES = { debts: "Долги", goals: "Цели", subscriptions: "Подписки", prices: "Цены" };

  function daysText(n) {
    if (n === null || n === undefined) return "";
    if (n === 0) return "сегодня";
    if (n === 1) return "завтра";
    if (n > 0) return "через " + n + " дн.";
    return "просрочено на " + Math.abs(n) + " дн.";
  }
  function itemRow(title, right, subs) {
    var box = el("div", "item");
    var row = el("div", "row");
    row.appendChild(el("span", "name", title));
    if (right) row.appendChild(el("span", "amt", right));
    box.appendChild(row);
    (subs || []).forEach(function (s) {
      if (!s) return;
      box.appendChild(el("div", "sub" + (s.cls ? " " + s.cls : ""), s.text));
    });
    return box;
  }
  function emptyOrError(sec, emptyText) {
    if (sec.error) return el("div", "msg", "Не удалось загрузить этот раздел. Попробуй позже.");
    if (!sec.items.length) return el("div", "msg", emptyText);
    return null;
  }

  function renderDebts(sec) {
    var f = document.createDocumentFragment();
    if (sec.error || !sec.items.length) { f.appendChild(emptyOrError(sec, "Открытых долгов нет.")); return f; }
    var cards = el("div", "cards");
    cards.appendChild(card("Нам должны", money(sec.lent_total)));
    cards.appendChild(card("Мы должны", money(sec.borrowed_total)));
    f.appendChild(cards);
    f.appendChild(el("h2", "", "Открытые долги"));
    sec.items.forEach(function (d) {
      var who = d.direction === "lent" ? "нам должны" : "мы должны";
      var subs = [{ text: who + (d.amount !== d.balance ? " · изначально " + money(d.amount) : "") }];
      if (d.due_date) subs.push({
        text: "Срок " + d.due_date + " · " + daysText(d.days_left),
        cls: d.days_left < 0 ? "over" : (d.days_left <= 3 ? "warn" : ""),
      });
      if (d.note) subs.push({ text: d.note });
      f.appendChild(itemRow(d.counterparty || "Без имени", money(d.balance), subs));
    });
    return f;
  }

  function renderGoals(sec) {
    var f = document.createDocumentFragment();
    if (sec.error || !sec.items.length) { f.appendChild(emptyOrError(sec, "Активных целей пока нет.")); return f; }
    f.appendChild(el("div", "cards")).appendChild(card("Накоплено по целям", money(sec.saved_total), { wide: true }));
    f.appendChild(el("h2", "", "Копилки"));
    sec.items.forEach(function (g) {
      var box = itemRow(g.name, g.pct + "%", []);
      var bar = el("div", "bar " + (g.pct >= 100 ? "" : "none"));
      var fill = el("i"); fill.style.width = Math.max(2, Math.min(100, g.pct)) + "%";
      bar.appendChild(fill); box.appendChild(bar);
      box.appendChild(el("div", "sub", money(g.current) + " из " + money(g.target) + (g.remaining > 0 ? " · осталось " + money(g.remaining) : " · цель достигнута")));
      if (g.deadline) box.appendChild(el("div", "sub" + (g.days_left !== null && g.days_left < 0 && g.remaining > 0 ? " over" : ""),
        "до " + g.deadline + (g.days_left !== null ? " · " + daysText(g.days_left) : "")));
      f.appendChild(box);
    });
    return f;
  }

  function renderSubs(sec) {
    var f = document.createDocumentFragment();
    if (sec.error || !sec.items.length) { f.appendChild(emptyOrError(sec, "Активных подписок нет.")); return f; }
    f.appendChild(el("div", "cards")).appendChild(card("В месяц", money(sec.month_total), { wide: true }));
    f.appendChild(el("h2", "", "Ближайшие списания"));
    sec.items.forEach(function (s) {
      f.appendChild(itemRow(s.name, money(s.amount), [{
        text: "спишется " + s.next_date + " · " + daysText(s.days_left) + (s.bank ? " · " + s.bank : ""),
        cls: s.days_left <= 2 ? "warn" : "",
      }]));
    });
    return f;
  }

  var PRICE_STATUS = { active: ["следим", ""], reached: ["цель достигнута", "good"], broken: ["не удалось проверить", "bad"] };
  function renderPrices(sec) {
    var f = document.createDocumentFragment();
    if (sec.error || !sec.items.length) { f.appendChild(emptyOrError(sec, "Ничего не отслеживаем. Пришли боту ссылку Kaspi и «следи за ценой».")); return f; }
    f.appendChild(el("h2", "", "Отслеживаемые товары"));
    sec.items.forEach(function (p) {
      var st = PRICE_STATUS[p.status];
      var subs = [];
      if (p.first_price > 0) {
        var line = "было " + money(p.first_price);
        if (p.change_pct !== null && p.change_pct !== 0) line += " · " + (p.change_pct < 0 ? "" : "+") + String(p.change_pct).replace(".", ",") + "%";
        subs.push({ text: line, cls: p.change_pct !== null && p.change_pct < 0 ? "good" : "" });
      }
      if (p.target_price) subs.push({ text: "цель " + money(p.target_price) });
      var box = itemRow(p.name, p.last_price ? money(p.last_price) : "—", subs);
      var chip = el("span", "chip " + st[1], st[0]);
      var wrapChip = el("div", "sub"); wrapChip.appendChild(chip); box.appendChild(wrapChip);
      if (p.url) {
        var a = el("a", "link", "Открыть в Kaspi"); a.href = p.url;
        a.addEventListener("click", function (ev) { if (tg.openLink) { ev.preventDefault(); tg.openLink(p.url); } });
        box.appendChild(a);
      }
      f.appendChild(box);
    });
    return f;
  }

  function renderLoans(d) {
    var f = document.createDocumentFragment();
    f.appendChild(el("h2", "", "Кредитная нагрузка"));
    var cur = d.months[d.months.length - 1];
    if (!d.months.some(function (m) { return m.total > 0; })) {
      f.appendChild(el("div", "msg", "Платежей по кредитам и рассрочкам за 3 месяца не нашла."));
      f.appendChild(el("div", "note", d.note));
      return f;
    }
    var cards = el("div", "cards");
    cards.appendChild(card("Платежи в этом месяце", money(cur.total)));
    cards.appendChild(card("От дохода месяца", cur.share_pct === null ? "—" : cur.share_pct + "%"));
    f.appendChild(cards);
    d.months.slice().reverse().forEach(function (m) {
      f.appendChild(itemRow(m.label, money(m.total),
        [{ text: m.count + " " + (m.count === 1 ? "платёж" : "платежей") + (m.share_pct !== null ? " · " + m.share_pct + "% дохода" : "") }]));
    });
    if (d.payees.length) {
      f.appendChild(el("h2", "", "Кому платим"));
      d.payees.forEach(function (p) {
        f.appendChild(itemRow(p.name, p.amount > 0 ? money(p.amount) : "—",
          [{ text: (p.amount > 0 ? "в этом месяце · " : "в этом месяце не платили · ") + "в среднем " + money(p.avg) + " · платежи в " + p.months_seen + " из 3 мес." }]));
      });
    }
    f.appendChild(el("div", "note", d.note));
    return f;
  }

  var loansCache = null;
  async function fillLoans(box, force) {
    if (loansCache && !force) { box.replaceChildren(renderLoans(loansCache)); return; }
    try {
      var r = await fetch("/api/loans" + (force ? "?refresh=1" : ""), { headers: { "X-Telegram-Init-Data": tg.initData } });
      if (!r.ok) return;
      loansCache = await r.json();
      box.replaceChildren(renderLoans(loansCache));
    } catch (e) { /* раздел кредитов необязателен: список долгов покажется и без него */ }
  }

  var listsCache = null;
  function renderList(tab, data, force) {
    document.getElementById("title").textContent = TAB_TITLES[tab];
    document.getElementById("updated").textContent = "обновлено " + data.updated_at;
    var frag = document.createDocumentFragment();
    var sec = data[tab];
    var body = { debts: renderDebts, goals: renderGoals, subscriptions: renderSubs, prices: renderPrices }[tab](sec);
    frag.appendChild(body);
    if (tab === "debts") {
      var loansBox = el("div");
      frag.appendChild(loansBox);
      fillLoans(loansBox, !!force);
    }
    var btn = el("button", "", "Обновить");
    btn.addEventListener("click", function () { loadLists(true, btn); });
    frag.appendChild(btn);
    root.replaceChildren(frag);
  }

  async function loadLists(force, btn) {
    var my = ++seq;
    if (btn) btn.disabled = true;
    if (!force && listsCache) { renderList(state.tab, listsCache); return; }
    try {
      var r = await fetch("/api/lists" + (force ? "?refresh=1" : ""), { headers: { "X-Telegram-Init-Data": tg.initData } });
      if (my !== seq) return;
      if (r.status === 403) return message("Доступ закрыт.");
      if (!r.ok) return message("Не удалось загрузить данные. Попробуй чуть позже.");
      listsCache = await r.json();
      if (my !== seq) return;
      renderList(state.tab, listsCache, force);
    } catch (e) {
      if (my === seq) message("Не удалось связаться с сервером.");
    }
  }

  document.getElementById("tabs").addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b || b.dataset.t === state.tab) return;
    state.tab = b.dataset.t;
    syncBack();
    this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
    document.getElementById("controls").style.display = state.tab === "overview" ? "" : "none";
    message("Загружаю…");
    if (state.tab === "overview") load(false); else loadLists(false);
  });

  function bindSeg(id, key) {
    document.getElementById(id).addEventListener("click", function (ev) {
      var b = ev.target.closest("button");
      if (!b || b.dataset.v === state[key]) return;
      state[key] = b.dataset.v;
      this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
      message("Загружаю…");
      load(false);
    });
  }
  bindSeg("who", "who");
  bindSeg("per", "period");

  if (!tg || !tg.initData) {
    message("Открой мини-апп из Telegram, через кнопку в боте.");
    return;
  }
  tg.ready();
  tg.expand();
  if (tg.BackButton) tg.BackButton.onClick(function () { if (state.cat && state.tab === "overview") closeCategory(); });
  load(false);
})();
</script>
</body>
</html>
